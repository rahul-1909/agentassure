name: AgentAssure CI / CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio flake8 black isort

      - name: Lint and Format Verification
        run: |
          black --check agentassure tests
          isort --check-only agentassure tests
          flake8 agentassure tests --max-line-length=120 --ignore=E203,W503,F401,F841,E501,E226

      - name: Build Frontend Application
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Execute Pytest Suite with Coverage Gate (>85%)
        run: |
          python -m pytest --cov=agentassure --cov-report=xml --cov-report=term --cov-fail-under=85

      - name: Upload Test Coverage Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    needs: test-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Cache Production Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: agentassure:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
