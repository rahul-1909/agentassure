name: CI Automated Release Gate Evaluation

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      agent_version:
        description: "Candidate agent version tag to evaluate"
        required: true
        default: "v2.5.0-rc1"
      baseline_version:
        description: "Production baseline to compare against"
        required: false
        default: "v2.4.0"

jobs:
  evaluate-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Initialize Database and Execute Release Gate
        id: run-gate
        run: |
          python -m agentassure.cli.main init-db
          python -m agentassure.cli.main run-gate --version ${{ github.event.inputs.agent_version || 'v2.5.0-candidate' }} --commit ${{ github.sha }}

      - name: Comment Gate Results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = `### 🛡️ AgentAssure Release Gate: Evaluated for Commit \`${context.sha.substring(0, 7)}\`\nAll critical safety and compliance assertions verified against baseline.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
